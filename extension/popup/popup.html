<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tether</title>
  <meta name="description" content="Check a Claude, ChatGPT or Gemini chat in as a Markdown capsule and board it to another assistant.">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="../icons/icon-32.png" width="24" height="24" alt="">
    <span class="brand">Tether</span>
  </header>

  <section class="board" aria-labelledby="board-title">
    <div class="board-head">
      <h1 id="board-title">Now boarding</h1>
      <time class="clock" id="clock"></time>
    </div>
    <dl class="board-grid">
      <div class="cell">
        <dt>From</dt>
        <dd class="flaps" id="from" data-width="3"></dd>
      </div>
      <div class="cell cell-chat">
        <dt>Chat</dt>
        <dd class="title" id="chat-title">Looking at this tab</dd>
      </div>
      <div class="cell cell-turns">
        <dt>Turns</dt>
        <dd class="flaps" id="turns" data-width="3" data-align="end"></dd>
      </div>
    </dl>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="controls" aria-label="Check in">
    <fieldset class="size" id="size">
      <legend>Capsule size</legend>
      <div class="size-track">
        <input type="radio" name="size" id="size-compact" value="compact"><label for="size-compact"><b>Compact</b><span>about 2k tokens</span></label>
        <input type="radio" name="size" id="size-standard" value="standard" checked><label for="size-standard"><b>Standard</b><span>about 6k tokens</span></label>
        <input type="radio" name="size" id="size-full" value="full"><label for="size-full"><b>Full</b><span>every turn</span></label>
      </div>
    </fieldset>
    <button class="primary" id="checkin" type="button" disabled>
      <span class="primary-label">Check in this chat</span><kbd>Alt Shift T</kbd>
    </button>
  </section>

  <section class="manifest" aria-labelledby="manifest-title">
    <div class="manifest-head">
      <h2 id="manifest-title">Manifest</h2>
      <span id="count" class="count"></span>
    </div>
    <ol id="tickets" class="tickets"></ol>
    <div id="empty" class="empty" hidden>
      <div class="empty-flaps" aria-hidden="true"><span>N</span><span>O</span><span class="gap"></span><span>P</span><span>A</span><span>S</span><span>S</span></div>
      <p>No capsules yet. Open a chat in Claude, ChatGPT or Gemini and check it in; its boarding pass prints here.</p>
    </div>
  </section>

  <details class="settings">
    <summary>Handoff note</summary>
    <label for="note">Sent first, so the next assistant knows what it is reading. Leave it empty for the default.</label>
    <textarea id="note" rows="4" spellcheck="true"></textarea>
  </details>

  <footer class="foot">Capsules never leave this browser.</footer>

  <template id="ticket-tpl">
    <li class="ticket">
      <div class="stub">
        <span class="code from flaps" data-width="3"></span>
        <svg class="route" viewBox="0 0 8 24" aria-hidden="true"><path d="M4 0v20m-3-4 3 4 3-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="code to flaps" data-width="3"></span>
      </div>
      <div class="body">
        <p class="t-title"></p>
        <p class="t-meta"></p>
        <div class="t-actions">
          <span class="t-board" role="group" aria-label="Board to"></span>
          <button type="button" class="ghost" data-act="copy">Copy</button>
          <button type="button" class="ghost" data-act="save">.md</button>
          <button type="button" class="ghost danger" data-act="drop" aria-label="Delete capsule">Tear</button>
        </div>
      </div>
    </li>
  </template>

  <script src="../src/sites.js"></script>
  <script src="../src/capsule.js"></script>
  <script src="popup.js"></script>
</body>
</html>
