<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tether</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="../icons/icon-32.png" width="22" height="22" alt="">
    <span class="brand">Tether</span>
    <span class="clock" id="clock" aria-hidden="true"></span>
  </header>

  <section class="board" aria-labelledby="board-title">
    <h1 id="board-title" class="board-label">Now boarding</h1>
    <div class="board-grid">
      <span class="col-label">From</span>
      <span class="col-label">Chat</span>
      <span class="col-label right">Turns</span>
      <span class="flaps" id="from" data-width="3"></span>
      <span class="title" id="chat-title">—</span>
      <span class="flaps right" id="turns" data-width="3"></span>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <section class="controls" aria-label="Check in">
    <fieldset class="size" id="size">
      <legend>Capsule size</legend>
      <label><input type="radio" name="size" value="compact"><span><b>Compact</b><i>≈2k tokens</i></span></label>
      <label><input type="radio" name="size" value="standard" checked><span><b>Standard</b><i>≈6k tokens</i></span></label>
      <label><input type="radio" name="size" value="full"><span><b>Full</b><i>every turn</i></span></label>
    </fieldset>
    <button class="primary" id="checkin" type="button" disabled>
      <span>Check in this chat</span><kbd>Alt Shift T</kbd>
    </button>
  </section>

  <section class="manifest" aria-labelledby="manifest-title">
    <div class="manifest-head">
      <h2 id="manifest-title">Manifest</h2>
      <span id="count" class="count"></span>
    </div>
    <ol id="tickets" class="tickets"></ol>
    <div id="empty" class="empty" hidden>
      <div class="empty-flaps" aria-hidden="true"><span>N</span><span>O</span><span> </span><span>P</span><span>A</span><span>S</span><span>S</span></div>
      <p>No capsules yet. Open a chat in Claude, ChatGPT or Gemini and check it in. Your boarding passes appear here.</p>
    </div>
  </section>

  <details class="settings">
    <summary>Handoff note</summary>
    <label for="note">Sent first, so the next assistant knows what it is reading. Leave empty for the default.</label>
    <textarea id="note" rows="4" spellcheck="true"></textarea>
  </details>

  <footer class="foot">Capsules never leave this browser.</footer>

  <template id="ticket-tpl">
    <li class="ticket">
      <div class="stub">
        <span class="code from"></span>
        <svg class="route" viewBox="0 0 24 8" aria-hidden="true"><path d="M0 4h20m-4-3 4 3-4 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span class="code to">···</span>
      </div>
      <div class="body">
        <p class="t-title"></p>
        <p class="t-meta"></p>
        <div class="t-actions">
          <span class="t-board" role="group" aria-label="Board to"></span>
          <button type="button" class="ghost" data-act="copy">Copy</button>
          <button type="button" class="ghost" data-act="save">.md</button>
          <button type="button" class="ghost danger" data-act="drop" aria-label="Delete capsule">Tear</button>
        </div>
      </div>
    </li>
  </template>

  <script src="../src/sites.js"></script>
  <script src="../src/capsule.js"></script>
  <script src="popup.js"></script>
</body>
</html>
